<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucas Balani — Desenvolvedor Backend .NET Pleno</title>
<meta name="description" content="Desenvolvedor Backend .NET Pleno com foco em healthtech e Agentic AI / Agent Engineering.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23512BD4%22/><text x=%2250%22 y=%2268%22 font-size=%2258%22 font-family=%22Arial, sans-serif%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>LB</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-200 antialiased min-h-screen">

  <header class="sticky top-0 z-50 border-b border-surface-border bg-surface/80 backdrop-blur">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <a href="#top" class="font-bold text-white">Lucas Balani</a>
      <nav class="hidden gap-6 md:flex">
        <a href="#about" class="nav-link" data-nav="about"></a>
        <a href="#experience" class="nav-link" data-nav="experience"></a>
        <a href="#skills" class="nav-link" data-nav="skills"></a>
        <a href="#education" class="nav-link" data-nav="certifications"></a>
        <a href="#contact" class="nav-link" data-nav="contact"></a>
      </nav>
      <button id="lang-toggle" class="rounded-md border border-surface-border px-3 py-1.5 text-sm font-semibold text-slate-200 hover:border-dotnet-light hover:text-dotnet-light transition-colors">
        EN
      </button>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="mx-auto max-w-5xl px-6 py-20 sm:py-28">
      <p id="hero-kicker" class="mb-3 font-semibold uppercase tracking-wide text-dotnet-light"></p>
      <h1 id="hero-name" class="text-4xl font-extrabold text-white sm:text-6xl"></h1>
      <p id="hero-headline" class="mt-4 text-lg text-slate-300 sm:text-xl"></p>
      <p id="hero-location" class="mt-2 text-slate-400"></p>
      <div class="mt-8 flex flex-wrap gap-4">
        <a id="hero-cta-cv" href="assets/curriculo-pt.pdf" class="btn-primary" download></a>
        <a id="hero-cta-contact" href="#contact" class="btn-secondary"></a>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="border-t border-surface-border bg-surface-panel/40">
      <div class="mx-auto max-w-5xl px-6 py-16">
        <h2 id="about-title" class="text-2xl font-bold text-white"></h2>
        <div id="about-body" class="mt-6 space-y-4 text-slate-300 leading-relaxed"></div>
      </div>
    </section>

    <!-- Experience -->
    <section id="experience" class="mx-auto max-w-5xl px-6 py-16">
      <h2 id="experience-title" class="text-2xl font-bold text-white"></h2>
      <div id="experience-list" class="mt-8 space-y-10"></div>
    </section>

    <!-- Skills -->
    <section id="skills" class="border-t border-surface-border bg-surface-panel/40">
      <div class="mx-auto max-w-5xl px-6 py-16">
        <h2 id="skills-title" class="text-2xl font-bold text-white"></h2>
        <div id="skills-list" class="mt-8 space-y-6"></div>
      </div>
    </section>

    <!-- Education & Certifications -->
    <section id="education" class="mx-auto max-w-5xl px-6 py-16">
      <h2 id="education-title" class="text-2xl font-bold text-white"></h2>
      <div id="education-body" class="mt-8 space-y-4"></div>
    </section>

    <!-- Contact -->
    <section id="contact" class="border-t border-surface-border bg-surface-panel/40">
      <div class="mx-auto max-w-5xl px-6 py-16 text-center">
        <h2 id="contact-title" class="text-2xl font-bold text-white"></h2>
        <p id="contact-subtitle" class="mx-auto mt-4 max-w-xl text-slate-300"></p>
        <div id="contact-links" class="mt-8 flex flex-wrap justify-center gap-4"></div>
      </div>
    </section>
  </main>

  <footer class="border-t border-surface-border px-6 py-8 text-center text-sm text-slate-500">
    <p id="footer-text"></p>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
